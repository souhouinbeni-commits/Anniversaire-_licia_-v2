<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pour Licia 💌</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 50% 35%, #ffd9e8 0%, #f8a9c5 35%, #df6f9d 75%, #b83f72 100%);
      color: #fff;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Lumière derrière l'enveloppe */
    .glow {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      filter: blur(45px);
      animation: glow 4s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.9;
      }
    }

    /* Petits cœurs */
    .heart {
      position: absolute;
      font-size: 18px;
      opacity: 0;
      animation: floatHeart linear infinite;
      user-select: none;
      pointer-events: none;
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(110vh) scale(0.7) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 0.7;
      }
      85% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(-15vh) scale(1.2) rotate(25deg);
        opacity: 0;
      }
    }

    .content {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 25px;
    }

    .little-text {
      font-size: 15px;
      letter-spacing: 2px;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    /* ENVELOPPE */
    .envelope-container {
      width: 300px;
      height: 220px;
      position: relative;
      cursor: pointer;
      margin: auto;
      transition: transform 0.3s ease;
    }

    .envelope-container:hover {
      transform: scale(1.03);
    }

    .envelope {
      width: 100%;
      height: 180px;
      position: absolute;
      bottom: 0;
      background: linear-gradient(145deg, #ffb4cf, #ed709f);
      border-radius: 8px;
      box-shadow:
        0 25px 50px rgba(95, 20, 55, 0.35),
        inset 0 1px 0 rgba(255,255,255,0.4);
    }

    /* rabat */
    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-top: 105px solid #ff91b7;
      transform-origin: top center;
      transition: transform 1s cubic-bezier(.68,-0.55,.27,1.55);
      z-index: 4;
    }

    /* intérieur */
    .inside {
      position: absolute;
      width: 88%;
      height: 145px;
      left: 6%;
      top: 12px;
      background: #fff8fb;
      border-radius: 5px;
      z-index: 2;
      box-shadow: 0 5px 20px rgba(120, 20, 60, 0.12);
    }

    /* cœur/cachet */
    .seal {
      position: absolute;
      left: 50%;
      top: 82px;
      transform: translate(-50%, -50%);
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #d94176;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      z-index: 6;
      box-shadow: 0 8px 20px rgba(110, 15, 55, 0.3);
      transition: all 0.5s ease;
    }

    .envelope-container.open .flap {
      transform: rotateX(180deg);
    }

    .envelope-container.open .seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.5);
    }

    .envelope-container.open {
      animation: envelopeOpen 1.2s ease forwards;
    }

    @keyframes envelopeOpen {
      50% {
        transform: scale(1.08);
      }
      100% {
        transform: scale(0.95);
        opacity: 0;
      }
    }

    .open-text {
      margin-top: 35px;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(80, 0, 35, 0.25);
      animation: pulseText 2s ease-in-out infinite;
    }

    @keyframes pulseText {
      0%, 100% {
        transform: translateY(0);
        opacity: 0.9;
      }
      50% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    .subtitle {
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.8;
    }

    /* écran après ouverture */
    .welcome {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      background:
        radial-gradient(circle at center, #ffe6f0, #f5a5c2 55%, #c84e7e);
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.5s ease;
    }

    .welcome.show {
      opacity: 1;
      visibility: visible;
    }

    .welcome h1 {
      font-size: clamp(32px, 9vw, 65px);
      margin-bottom: 20px;
      color: #8d2855;
    }

    .welcome p {
      max-width: 500px;
      font-size: 18px;
      line-height: 1.8;
      color: #702441;
    }

    .continue {
      margin-top: 35px;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      background: #a92f61;
      color: white;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(100,20,50,.25);
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="glow"></div>

    <!-- Cœurs flottants -->
    <div class="heart" style="left:8%; animation-duration:8s;">♡</div>
    <div class="heart" style="left:20%; animation-duration:11s; animation-delay:2s;">♥</div>
    <div class="heart" style="left:35%; animation-duration:9s; animation-delay:1s;">♡</div>
    <div class="heart" style="left:55%; animation-duration:12s; animation-delay:3s;">♥</div>
    <div class="heart" style="left:72%; animation-duration:10s; animation-delay:1.5s;">♡</div>
    <div class="heart" style="left:88%; animation-duration:13s; animation-delay:4s;">♥</div>

    <div class="content">

      <div class="little-text">
        POUR TOI, LICIA ✨
      </div>

      <div class="envelope-container" id="envelope">

        <div class="envelope">

          <div class="inside"></div>

          <div class="flap"></div>

          <div class="seal">
            ❤️
          </div>

        </div>

      </div>

      <div class="open-text">
        Ouvre-moi 💌
      </div>

      <div class="subtitle">
        J'ai préparé quelque chose pour toi...
      </div>

    </div>

  </div>


  <!-- ÉCRAN APRÈS OUVERTURE -->

  <div class="welcome" id="welcome">

    <h1>Pour toi, ma vie ❤️</h1>

    <p>
      Il y a des personnes qu'on rencontre...
      et d'autres qu'on remercie simplement
      d'exister.
    </p>

    <button class="continue" onclick="startExperience()">
      Continuer ✨
    </button>

  </div>


  <script>

    const envelope = document.getElementById("envelope");
    const welcome = document.getElementById("welcome");

    envelope.addEventListener("click", () => {

      envelope.classList.add("open");

      setTimeout(() => {
        welcome.classList.add("show");
      }, 900);

    });

    function startExperience() {

      alert("Notre aventure commence ici ❤️");

    }

  </script>

</body>
</html>
